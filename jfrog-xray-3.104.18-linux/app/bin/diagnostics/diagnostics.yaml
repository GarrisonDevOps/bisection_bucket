        - portbind
        - "{{router.entrypoints.grpcPort:8047}}"
      message:
        failure: "Router grpc port ({{router.entrypoints.grpcPort:8047}}) is being used by another process"
        success: "Router grpc port ({{router.entrypoints.grpcPort:8047}}) is open"
