[[rules]]
id = 'gitlab_personal_access_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glpat-[0-9a-zA-Z_\-]{20})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab personal access token was identified. Personal access tokens can be used to access GitLab services\nas the user who created them. In most cases these tokens are given read-write access to all repositories. A malicious\nactor with access to this token can execute functionality on behalf of the user with the given permissions of the token."
title = 'GitLab personal access token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a personal access token:\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Personal access tokens**.\n1. Note the permissions assigned to the identified token, then select the vertical ellipsis icon next to it.\n1. Select **Revoke**.\n1. On the confirmation dialog, select **Revoke**."
tags = ['gitlab', 'revocation_type', 'gitlab_blocking', 'client_side_sd']
keywords = ['glpat']

[[rules]]
id = 'gitlab_personal_access_token_routable'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glpat-[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}[0-9a-z]{7})\b'
description = "A GitLab personal access token was identified. This is the routable token format, which encodes cell-routing\ninformation alongside the token secret so requests can be sent to the correct GitLab cell. Functionally it behaves\nexactly like a standard personal access token (`glpat-...`): it can be used to access GitLab services as the user\nwho created it, and in most cases is given read-write access to all repositories. A malicious actor with access to\nthis token can execute functionality on behalf of the user with the given permissions of the token."
title = 'GitLab personal access token (routable)'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a personal access token:\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Personal access tokens**.\n1. Note the permissions assigned to the identified token, then select the vertical ellipsis icon next to it.\n1. Select **Revoke**.\n1. On the confirmation dialog, select **Revoke**."
tags = ['gitlab', 'revocation_type', 'gitlab_blocking', 'client_side_sd']
keywords = ['glpat-']

[[rules]]
id = 'gitlab_personal_access_token_routable_versioned'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glpat-[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}\.[0-9a-z]{2}[0-9a-z]{7})\b'
description = "A GitLab personal access token was identified. This is the routable and versioned token format, which encodes\ncell-routing information and a format version segment alongside the token secret so requests can be sent to the\ncorrect GitLab cell. Functionally it behaves exactly like a standard personal access token (`glpat-...`): it can be\nused to access GitLab services as the user who created it, and in most cases is given read-write access to all\nrepositories. A malicious actor with access to this token can execute functionality on behalf of the user with the\ngiven permissions of the token."
title = 'GitLab personal access token (routable, versioned)'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a personal access token:\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Personal access tokens**.\n1. Note the permissions assigned to the identified token, then select the vertical ellipsis icon next to it.\n1. Select **Revoke**.\n1. On the confirmation dialog, select **Revoke**."
tags = ['gitlab', 'revocation_type', 'gitlab_blocking', 'client_side_sd']
keywords = ['glpat-']

[[rules]]
id = 'gitlab_pipeline_trigger_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glptt-(?:[0-9a-zA-Z_\-]{20}|[0-9a-zA-Z_\-]{40}))(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab pipeline trigger token was identified. Pipeline trigger tokens can be used to execute pipelines for a branch\nor tag of a project. The token impersonates a user's project access and permissions. A malicious actor with access to\nthis token can execute pipelines with custom variables, potentially being able to compromise the repository."
title = 'GitLab pipeline trigger token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a pipeline trigger token:\n\n- Sign in to your GitLab account and visit the project that created the pipeline trigger token\n- In the left-hand menu, select \"Settings\"\n- Under the \"Settings\" options, select \"CI/CD\"\n- Under the \"Pipeline trigger tokens\" section find the identified token\n- Select the trash icon in the \"Actions\" column of the \"Active pipeline trigger tokens\" table\n- When prompted, select \"Revoke trigger\"\n\nFor more information, please see [GitLabs documentation on pipeline trigger tokens](https://docs.gitlab.com/ee/ci/triggers/index.html#create-a-pipeline-trigger-token)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['glptt']

[[rules]]
id = 'gitlab_runner_registration_token'
regex = '\b(GR1348941[0-9a-zA-Z_\-]{20})(?:[[:punct:]]|[[:space:]]|[[:blank:]]|$)'
description = "A deprecated GitLab runner registration token was identified. These tokens allow users to register a runner with the\nselected project. A malicious actor with access to this token can add a custom runner to the pipeline and possibly\ncompromise the repository if the runner was used."
title = 'GitLab runner registration token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo rotate a runner registration token:\n\n- Sign in to your GitLab account and visit the project that created the runner registration token\n- In the left-hand menu, select \"Settings\"\n- Under the \"Settings\" options, select \"CI/CD\"\n- Under the \"Runners\" section, select the kebab menu (vertical ellipsis) next to the \"New project runner\"\n- Select \"Reset registration token\" from the dropdown list\n- When prompted select \"Reset token\" in the \"Reset registration token\" dialog\n\nFor more information, please see [GitLabs documentation on using runner authentication tokens instead](https://docs.gitlab.com/runner/register/#register-with-a-runner-authentication-token)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['GR1348941']

[[rules]]
id = 'gitlab_runner_auth_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glrtr?-(?:t[1-3]_)?[0-9a-zA-Z_\-]{20})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab runner authentication token was identified. This rule matches the non-routable formats:\n\n- `glrt-` followed by 20 characters, for runners created in the GitLab UI or API. GitLab made this format before it\n  used routable runner tokens. It still makes it for a runner that has no owner.\n- `glrtr-` followed by 20 characters, for runners registered with a runner registration token.\n- `glrt-t1_`, `glrt-t2_` or `glrt-t3_` followed by 20 characters, a legacy format from older GitLab versions.\n\nIf the instance has an instance token prefix, a `glrt-` token can start with that prefix and a hyphen, for example\n`acme-glrt-`. `glrtr-` tokens do not get this prefix.\n\nA runner uses this token to authenticate with GitLab and to pick up CI/CD jobs. A malicious actor with access to this\ntoken can authenticate as the runner and take its CI/CD jobs. The actor can then read job variables and secrets, and\ncan change job output."
title = 'GitLab runner authentication token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo reset a runner authentication token, delete the runner and create a new runner:\n\n1. Go to the runner list:\n   - For a project runner: find your project, and in the left sidebar select **Settings** > **CI/CD**. Expand\n     **Runners**.\n   - For a group runner: find your group, and in the left sidebar select **Build** > **Runners**.\n   - For an instance runner: in the upper-right corner select **Admin**, and in the left sidebar select **CI/CD** >\n     **Runners**.\n1. Find the runner that uses the identified token. The list shows each runner as `#<ID> (<short token>)`. The short\n   token is the first 8 characters after the token prefix, for example after `glrt-`, `glrtr-` or `t1_`.\n1. Delete the runner:\n   - For a group runner or an instance runner, next to the runner, select **Delete runner** (remove icon).\n   - For a project runner, in the **Assigned project runners** section, select **Remove runner**, then select\n     **Remove**. If the runner is enabled in more than one project, disable it in the other projects first.\n1. Create a new runner. GitLab gives the new runner a new authentication token.\n1. On the runner host, register the new runner. To stop the old runner from contacting GitLab, unregister the\n   deleted runner from the `config.toml` file.\n1. Optional. To verify that GitLab revoked the old token, use the\n   [Runners API](https://docs.gitlab.com/api/runners/#verify-authentication-for-a-registered-runner).\n\nFor more information, see\n[Reset the runner configuration authentication token](https://docs.gitlab.com/ci/runners/configure_runners/#reset-the-runner-configuration-authentication-token)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['glrt']

[[rules]]
id = 'gitlab_runner_auth_token_routable'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glrtr?-[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}\.[0-9a-z]{2}[0-9a-z]{7})\b'
description = "A routable GitLab runner authentication token was identified. The token starts with `glrt-`, or with `glrtr-`\nwhen the runner was registered with a runner registration token. The token encodes cell-routing information alongside\nthe token secret.\n\nA runner uses this token to authenticate with GitLab and to pick up CI/CD jobs. A malicious actor with access to this\ntoken can authenticate as the runner and take its CI/CD jobs. The actor can then read job variables and secrets, and\ncan change job output."
title = 'GitLab runner authentication token (routable)'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo reset a runner authentication token, delete the runner and create a new runner:\n\n1. Go to the runner list:\n   - For a project runner: find your project, and in the left sidebar select **Settings** > **CI/CD**. Expand\n     **Runners**.\n   - For a group runner: find your group, and in the left sidebar select **Build** > **Runners**.\n   - For an instance runner: in the upper-right corner select **Admin**, and in the left sidebar select **CI/CD** >\n     **Runners**.\n1. Find the runner that uses the identified token. The list shows each runner as `#<ID> (<short token>)`. The short\n   token is the first 8 characters after the token prefix, for example after `glrt-`, `glrtr-` or `t1_`.\n1. Delete the runner:\n   - For a group runner or an instance runner, next to the runner, select **Delete runner** (remove icon).\n   - For a project runner, in the **Assigned project runners** section, select **Remove runner**, then select\n     **Remove**. If the runner is enabled in more than one project, disable it in the other projects first.\n1. Create a new runner. GitLab gives the new runner a new authentication token.\n1. On the runner host, register the new runner. To stop the old runner from contacting GitLab, unregister the\n   deleted runner from the `config.toml` file.\n1. Optional. To verify that GitLab revoked the old token, use the\n   [Runners API](https://docs.gitlab.com/api/runners/#verify-authentication-for-a-registered-runner).\n\nFor more information, see\n[Reset the runner configuration authentication token](https://docs.gitlab.com/ci/runners/configure_runners/#reset-the-runner-configuration-authentication-token)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['glrt']

[[rules]]
id = 'gitlab_oauth_app_secret'
regex = '\b(gloas-[0-9a-zA-Z_\-]{64})(?:[[:punct:]]|[[:space:]]|[[:blank:]]|$)'
description = "A GitLab OAuth application secret was identified. OAuth secrets are used when allowing users to sign in to your\napplication. Depending on the scopes assigned, a malicious actor could impersonate the service to access their\nrepositories or data."
title = 'GitLab OAuth application secret'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo regenerate an OAuth secret:\n\n- Sign in to your GitLab account and access: <https://gitlab.com/-/profile/preferences>\n- In the \"User settings\" left-hand side menu, select \"Applications\"\n- Find the application that uses the identified token and select the name link in the \"Name\" column\n- Select \"Renew secret\" in the application details page\n- When prompted, select \"Renew secret\"\n\nFor more information, please see [GitLabs documentation on configuring an OAuth 2.0 provider](https://docs.gitlab.com/ee/integration/oauth_provider.html)"
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['gloas']

[[rules]]
id = 'gitlab_feed_token_v2'
regex = '\b(glft-[0-9a-zA-Z_\-]{20})(?:[[:punct:]]|[[:space:]]|[[:blank:]]|$)'
description = "A GitLab feed token was identified. Your feed token authenticates you when your RSS reader loads a personalized RSS feed\nor when your calendar application loads a personalized calendar. It is visible in those feed URLs. It cannot be used to\naccess any other data. A malicious actor with access to this token can read your personalized RSS feed and issue RSS\nfeeds to your calendar feed as if they were you."
title = 'GitLab feed token v2'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo regenerate a feed token:\n\n- Sign in to your GitLab account and access: <https://gitlab.com/-/profile/preferences>\n- In the \"User settings\" left-hand side menu, select \"Access tokens\"\n- Under the \"Feed token\" section, select the \"reset this token\" link\n- When prompted select \"OK\"\n\nFor more information, please see [GitLabs documentation on feed tokens](https://docs.gitlab.com/ee/security/tokens/#feed-token)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['glft']

[[rules]]
id = 'gitlab_kubernetes_agent_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glagent-[0-9a-zA-Z_\-]{50})(?:[^0-9a-zA-Z_\-.]|\.[^0-9a-z]|\.$|$)'
description = "A GitLab Agent for Kubernetes token was identified. The Kubernetes access token is used to authenticate the GitLab agent\nwith a Kubernetes cluster. A malicious actor with access to this token can access source code in the agent's\nconfiguration project, access source code in any public project on the GitLab instance, or even, under very specific\nconditions, obtain a Kubernetes manifest."
title = 'GitLab Kubernetes agent token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nFor more information please see [GitLabs documentation on rotating the Kubernetes agent token](https://docs.gitlab.com/ee/user/clusters/agent/work_with_agent.html#reset-the-agent-token)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['glagent']

[[rules]]
id = 'gitlab_incoming_email_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glimt-[0-9a-z]{20,25})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab incoming email token was identified. Your incoming email token authenticates you when you create a new issue\nor merge request by email, and is included in your personal project-specific email addresses. It cannot be used to\naccess any other data. A malicious actor with access to this token can create issues and merge requests as if they\nwere you."
title = 'GitLab incoming email token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo reset an incoming email token:\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Personal access tokens**.\n1. Under **Incoming email token**, select **reset this token**.\n\nFor more information, see the [GitLab documentation on incoming email tokens](https://docs.gitlab.com/ee/security/tokens/#incoming-email-token)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['glimt']

[[rules]]
id = 'gitlab_deploy_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?gldt-[0-9a-zA-Z_\-]{20})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab deploy token was identified. A deploy token enables authentication of deployment tasks, independent of a user\naccount. With a deploy token, automated tasks can:\n\n- Clone Git repositories\n- Pull from and push to a GitLab container registry\n- Pull from and push to a GitLab package registry\n\nA malicious actor with access to this token can access git repositories or compromise released packages or containers."
title = 'GitLab deploy token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nFor more information, please see [GitLabs documentation on revoking deploy tokens](https://docs.gitlab.com/ee/user/project/deploy_tokens/#revoke-a-deploy-token)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['gldt']

[[rules]]
id = 'gitlab_deploy_token_routable'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?gldt-[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}\.[0-9a-z]{2}[0-9a-z]{7})\b'
description = "A routable GitLab deploy token was identified. The token starts with `gldt-` and encodes cell-routing\ninformation alongside the token secret. Functionally it behaves like a standard deploy token. With a deploy token,\nautomated tasks can:\n\n- Clone Git repositories\n- Pull from and push to a GitLab container registry\n- Pull from and push to a GitLab package registry\n\nA malicious actor with access to this token can read repositories or change released packages or containers."
title = 'GitLab deploy token (routable)'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a deploy token:\n\n1. In the top bar, select **Search or go to** and find your project or group.\n1. In the left sidebar, select **Settings** > **Repository**.\n1. Expand **Deploy tokens**.\n1. In the **Active deploy tokens** section, find the token by its **Username**. Select **Revoke**.\n1. In the dialog, select **Revoke** followed by the token name.\n\nTo revoke a group deploy token, you must have the Owner role for the group. To revoke a project deploy token, you must\nhave the Maintainer or Owner role for the project.\n\nFor more information, see [Revoke a deploy token](https://docs.gitlab.com/user/project/deploy_tokens/#revoke-a-deploy-token)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['gldt-']

[[rules]]
id = 'gitlab_deploy_token_in_url'
regex = 'gitlab\+deploy-token-[0-9]+:([0-9a-zA-Z_\-]{20})@'
description = "A GitLab deploy token was identified in a URL that uses the default deploy token username,\n`gitlab+deploy-token-<ID>`. This rule finds deploy tokens that GitLab created before it added the `gldt-` prefix.\nThese tokens have no prefix, and by default they do not expire.\n\nA deploy token can clone repositories, and can read from or write to the container registry and the package registry.\nA malicious actor with access to this token can read repositories or change released packages or containers."
title = 'GitLab deploy token in a Git URL'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a deploy token:\n\n1. In the top bar, select **Search or go to** and find your project or group.\n1. In the left sidebar, select **Settings** > **Repository**.\n1. Expand **Deploy tokens**.\n1. In the **Active deploy tokens** section, find the token by its **Username**. Select **Revoke**.\n1. In the dialog, select **Revoke** followed by the token name.\n\nTo revoke a group deploy token, you must have the Owner role for the group. To revoke a project deploy token, you must\nhave the Maintainer or Owner role for the project.\n\nFor more information, see [Revoke a deploy token](https://docs.gitlab.com/user/project/deploy_tokens/#revoke-a-deploy-token)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['gitlab+deploy-token-']

[[rules]]
id = 'gitlab_kubernetes_agent_token_routable'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glagent-[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}\.[0-9a-z]{2}[0-9a-z]{7})\b'
description = "A routable GitLab agent for Kubernetes token was identified. The token starts with `glagent-` and encodes\ncell-routing information alongside the token secret. GitLab creates all new agent tokens in this format.\n\nThe agent uses this token to connect to GitLab. A malicious actor with access to this token can connect to GitLab as\nthe agent. The actor can read source code in the agent configuration project and in public projects. In some\nconditions, the actor can get Kubernetes manifests."
title = 'GitLab Kubernetes agent token (routable)'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo reset the agent token, you must have the Maintainer or Owner role for the project:\n\n1. In the top bar, select **Search or go to** and find your project.\n1. Select **Operate** > **Kubernetes clusters**.\n1. Select the agent.\n1. On the **Access tokens** tab, select **Create token**. Enter a name and select **Create token**.\n1. Install the new token in your cluster.\n1. Return to the token list. By the identified token, select **Revoke token** (remove icon).\n1. Type the token name, then select **Revoke token**.\n\nAn agent can have only two active tokens at one time. If the agent already has two, revoke the identified token\nfirst. The token list does not show token values. To find the token from its value, an administrator can use the\nRails console. See [GitLab cluster agent tokens](https://docs.gitlab.com/security/tokens/#gitlab-cluster-agent-tokens).\n\nFor more information, see [Reset the agent token](https://docs.gitlab.com/user/clusters/agent/work_with_agent/#reset-the-agent-token)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['glagent-']

[[rules]]
id = 'gitlab_workspace_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glwt-[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}\.[0-9a-z]{2}[0-9a-z]{7})\b'
description = "A GitLab workspace token was identified. The token starts with `glwt-` and is a routable token. GitLab\ncreates a workspace token when a workspace starts, and deletes it when the workspace stops. The workspace agent\n(`agentw`) runs in the workspace. It uses the token to connect to the GitLab agent server (KAS).\n\nA malicious actor with access to this token can send requests as the workspace while the workspace runs."
title = 'GitLab workspace token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a workspace token, stop or terminate the workspace that owns it. GitLab deletes the workspace\ntoken when the workspace is no longer in the running state. When you start the workspace again, GitLab creates a new\ntoken.\n\n1. In the top bar, select **Search or go to** and find your project.\n1. In the upper right, select **Code**.\n1. From the dropdown list, under **Your workspaces**, find the workspace where the token leaked.\n1. Stop or terminate the workspace. When you terminate a workspace, GitLab deletes any uncommitted data in it.\n\nTo stop another user's workspace, select **Operate** > **Kubernetes clusters**, select the agent, then select the\n**Workspaces** tab.\n\nEach workspace also has a personal access token with the `api` and `write_repository` scopes. Stopping the workspace\ndoes not revoke it. If this token can also have leaked, terminate the workspace.\n\nFor more information, see [Workspaces](https://docs.gitlab.com/user/workspace/)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['glwt-']

[[rules]]
id = 'gitlab_feature_flags_client_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glffct-[0-9a-zA-Z_\-]{20})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab feature flags client token was identified. The token starts with `glffct-`. In the GitLab UI it is\nshown as the **Instance ID** of the project's feature flags. Applications use it with an Unleash client to get the\nfeature flags of the project.\n\nA malicious actor with access to this token can read all feature flags of the project and their strategies. This can\nshow unreleased features and their names. Strategies that use user lists also show user IDs."
title = 'GitLab feature flags client token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo regenerate the feature flags instance ID, you must have the Maintainer or Owner role for the project.\n\n1. In the top bar, select **Search or go to** and find your project.\n1. In the left sidebar, select **Deploy** > **Feature flags**.\n1. Select **Configure**.\n1. Type the project name to confirm, then select **Regenerate instance ID**.\n1. Update your applications to use the new instance ID.\n\nFor more information, see [Get access credentials](https://docs.gitlab.com/operations/feature_flags/#get-access-credentials)."
tags = ['gitlab', 'gitlab_blocking', 'client_side_sd']
keywords = ['glffct-']

[[rules]]
id = 'gitlab_runner_controller_token'
regex = '\b((?:[a-zA-Z0-9]{1,20}-)?glrct-[0-9a-zA-Z_\-]{20})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab runner controller token was identified. The token starts with `glrct-`. A runner controller uses\nthis token to connect to the job router. The job router is part of GitLab Relay (KAS). Runner controllers are an\nExperiment in GitLab Ultimate on GitLab Self-Managed and GitLab Dedicated.\n\nA malicious actor with access to this token can authenticate as the runner controller."
title = 'GitLab runner controller token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke or rotate a runner controller token, use the runner controller tokens API. You must have administrator\naccess to the GitLab instance.\n\nTo revoke the token:\n\n```shell\ncurl --request DELETE \\\n    --header \"PRIVATE-TOKEN: <your_access_token>\" \\\n    --url \"https://gitlab.example.com/api/v4/runner_controllers/:id/tokens/:token_id\"\n```\n\nTo rotate the token, send `POST /runner_controllers/:id/tokens/:token_id/rotate`. GitLab revokes the old token and\nreturns a new token.\n\nFor more information, see [Runner controller tokens API](https://docs.gitlab.com/api/runner_controller_tokens/)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['glrct-']

[[rules]]
id = 'gitlab_ci_build_token_jwt'
regex = '\b(?:[a-zA-Z0-9]{1,20}-)?glcbt-eyJ[0-9a-zA-Z_\-]{10,1000}\.eyJ[0-9a-zA-Z_\-]{10,1000}\.[0-9a-zA-Z_\-]{20,1000}'
description = "A GitLab CI/CD job token in JSON Web Token (JWT) format was identified. The token starts with `glcbt-`\nfollowed by a JWT. New top-level groups use this format by default. A top-level group can turn it off with the\n**Enable JWT format for CI/CD job tokens** setting. GitLab always uses this format for users with composite identity,\nsuch as GitLab Duo agents.\n\nA job uses this token to authenticate with GitLab during the job. A malicious actor with access to this token can use\nthe permissions of the job until the job finishes."
title = 'GitLab CI/CD job token (JWT)'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nA job token is valid only while the job runs. After the job finishes, GitLab revokes the token.\n\nIf the job still runs, cancel it. You must have the Developer, Maintainer, or Owner role for the project, or the\nminimum role that your project sets to cancel jobs.\n\n1. In the top bar, select **Search or go to** and find your project.\n1. In the left sidebar, select **Build** > **Jobs**.\n1. Find the job and select **Cancel**.\n\nThe token stays valid until the job stops, which includes the time that `after_script` runs.\n\nRemove the token from the place where it leaked, for example a job log or an artifact. For more information, see\n[GitLab CI/CD job token](https://docs.gitlab.com/ci/jobs/ci_job_token/)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['glcbt-']

[[rules]]
id = 'gitlab_stateless_access_token'
regex = '\b(?:[a-zA-Z0-9]{1,20}-)?glsat-eyJ[0-9a-zA-Z_\-]{10,1000}\.eyJ[0-9a-zA-Z_\-]{10,1000}\.[0-9a-zA-Z_\-]{20,1000}'
description = "A GitLab stateless access token was identified. The token starts with `glsat-` followed by a JSON Web Token\n(JWT). GitLab issues this token to the GitLab Duo Agent Platform, for example for a GitLab Duo Workflow session. The\ntoken is valid for 2 hours, or 1 hour for a composite identity token.\n\nA malicious actor with access to this token can use the GitLab API with the scopes of the token until it expires."
title = 'GitLab stateless access token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nNo UI revokes a stateless access token. The token expires 2 hours after GitLab issues it, or 1 hour for a\ncomposite identity token.\n\n1. Cancel the GitLab Duo session that uses the token. This stops the CI/CD pipelines of the session, but it does\n   not revoke the token directly:\n   1. In the top bar, select **Search or go to** and find your project.\n   1. In the left sidebar, select **AI** > **Sessions**.\n   1. On the **Details** tab, select **Cancel session**.\n   1. In the confirmation dialog, select **Cancel session**.\n1. Remove the token from the place where it leaked.\n1. If you think someone used the token, check the audit events and the activity of the user that the token belongs\n   to."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['glsat-']

[[rules]]
id = 'gitlab_iam_access_token'
regex = '\bgliamat-eyJ[0-9a-zA-Z_\-]{10,1000}\.eyJ[0-9a-zA-Z_\-]{10,1000}\.[0-9a-zA-Z_\-]{20,1000}'
description = "A GitLab IAM OAuth access token was identified. The token starts with `gliamat-` followed by a JSON Web Token\n(JWT). The GitLab IAM service issues this token through OAuth. The IAM service is not generally available yet.\n\nA malicious actor with access to this token can use the GitLab API with the scopes of the token until it expires."
title = 'GitLab IAM OAuth access token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke the OAuth authorization of the application that received the token:\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Applications**.\n1. In the **Authorized applications** section, by the application, select **Revoke**.\n\nThis also revokes the tokens that the IAM service issued to that application for you.\n\nFor more information, see\n[View all authorized applications](https://docs.gitlab.com/integration/oauth_provider/#view-all-authorized-applications)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['gliamat-']

[[rules]]
id = 'gitlab_iam_refresh_token'
regex = '\b(gliamrt-[0-9a-zA-Z_\-]{43}\.[0-9a-zA-Z_\-]{43})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab IAM OAuth refresh token was identified. The token starts with `gliamrt-`. The GitLab IAM service\nissues this token through OAuth. A client uses it to get new access tokens. The IAM service is not generally\navailable yet.\n\nA malicious actor with access to this token can get new access tokens for the user."
title = 'GitLab IAM OAuth refresh token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke the OAuth authorization of the application that received the token:\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Applications**.\n1. In the **Authorized applications** section, by the application, select **Revoke**.\n\nThis also revokes the tokens that the IAM service issued to that application for you.\n\nFor more information, see\n[View all authorized applications](https://docs.gitlab.com/integration/oauth_provider/#view-all-authorized-applications)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['gliamrt-']

[[rules]]
id = 'gitlab_iam_authorization_code'
regex = '\b(gliamac-[0-9a-zA-Z_\-]{43}\.[0-9a-zA-Z_\-]{43})(?:[^0-9a-zA-Z_\-]|$)'
description = "A GitLab IAM OAuth authorization code was identified. The code starts with `gliamac-`. The GitLab IAM\nservice issues it during an OAuth sign-in, and a client exchanges it for tokens. The IAM service is not generally\navailable yet.\n\nA malicious actor who gets the code before the client uses it can try to exchange it for tokens. If the client\nuses a client secret or PKCE, the actor also needs that secret or the PKCE code verifier."
title = 'GitLab IAM OAuth authorization code'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nIf you think someone used the code, revoke the OAuth authorization of the application:\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Applications**.\n1. In the **Authorized applications** section, by the application, select **Revoke**.\n\nThis also revokes the tokens that the IAM service issued to that application for you.\n\nFor more information, see\n[View all authorized applications](https://docs.gitlab.com/integration/oauth_provider/#view-all-authorized-applications)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['gliamac-']

[[rules]]
id = 'gitlab_feed_token_path_dependent'
regex = '\b(?:[a-zA-Z0-9]{1,20}-)?glft-[0-9a-f]{64}-[0-9]{1,20}\b'
description = "A GitLab path-dependent feed token was identified. The token starts with `glft-`, followed by 64 hexadecimal\ncharacters, a hyphen, and a user ID. GitLab puts this token in feed URLs, for example RSS, Atom, and calendar URLs. The\ntoken is valid for one feed path only. GitLab makes it from the user's feed token.\n\nA malicious actor with access to this token can read the feed. A feed can show information from confidential issues."
title = 'GitLab path-dependent feed token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nReset the feed token of the user. This also makes all path-dependent feed tokens of that user invalid.\n\n1. In the upper-right corner, select your avatar.\n1. Select **Edit profile**.\n1. In the left sidebar, select **Access** > **Personal access tokens**.\n1. Scroll down. In the **Feed token** section, select the **reset this token** link.\n1. On the confirmation dialog, select **OK**.\n\nFor more information, see\n[Reset the user activity feed token](https://docs.gitlab.com/user/profile/contributions_calendar/#reset-the-user-activity-feed-token)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['glft-']

[[rules]]
id = 'gitlab_pipeline_trigger_token_in_url'
regex = '/trigger/pipeline\?(?:[0-9a-zA-Z_.%\[\]=-]{1,100}&){0,10}token=([0-9a-f]{30})\b'
description = "A GitLab pipeline trigger token was identified in a pipeline trigger URL. This rule finds trigger tokens\nthat GitLab created before it added the `glptt-` prefix. These tokens are 30 hexadecimal characters. Trigger tokens\nexpire only if an expiry date was set.\n\nA malicious actor with access to this token can run pipelines for a branch or tag of the project, with custom\nvariables."
title = 'GitLab pipeline trigger token in a trigger URL'
remediation = "For general guidance on handling security incidents with regards to leaked keys, see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a pipeline trigger token:\n\n1. In the top bar, select **Search or go to** and find your project.\n1. In the left sidebar, select **Settings** > **CI/CD**.\n1. Expand **Pipeline trigger tokens**.\n1. In the row of the identified token, in the **Actions** column, select **Revoke trigger** (remove icon).\n1. In the confirmation dialog, select **Revoke trigger**.\n\nFor more information, see\n[Revoke a pipeline trigger token](https://docs.gitlab.com/ci/triggers/#revoke-a-pipeline-trigger-token)."
tags = ['gitlab', 'gitlab_blocking']
keywords = ['/trigger/pipeline?']

[[rules]]
id = 'GrafanaCloudAccessPolicyToken'
regex = "\\b(glc_eyJvIjoi[A-Za-z0-9+\\/]{80,220}={0,2})(?:\\\\['\"rn]|['\"\\x60; \\s]|<\\/|$)"
description = "A Grafana cloud access policy token was identified. Cloud access policy tokens are used for managing the stacks in\nGrafana. Any tokens defined in the Grafana Administration settings are limited to that Grafana's stack. Depending on the\nassigned scope, a malicious actor with access to this token can read or write metrics, logs, traces, alerts, rules, and\naccess policies."
title = 'Grafana cloud access policy token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke an access policy token:\n\n- Sign in to your Grafana instance and select \"Administration\" on the left-hand menu\n- Under \"User and access\" select \"Cloud access policies\"\n- Find the token that was identified and select the trash icon.\n\nFor more information, please see [Grafana's documentation on cloud access policies](https://grafana.com/docs/grafana-cloud/account-management/authentication-and-permissions/access-policies/)."
tags = ['gitlab_blocking']
keywords = ['glc_eyJvIjoi']

[[rules]]
id = 'GrafanaServiceAccountToken'
regex = '\bglsa_[a-zA-Z0-9]{32}_[0-9a-f]{8}\b'
description = "A Grafana service account token was identified. A service account token is a generated random string that acts as an\nalternative to a password when authenticating with Grafana's HTTP API. When you create a service account, you can\nassociate one or more access tokens with it. You can use service access tokens the same way as API keys, for example to\naccess Grafana HTTP API programmatically. A malicious actor with access to this token can call the API with the\npermissions of the service account."
title = 'Grafana service account token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke a service account token:\n\n- Sign in to your Grafana instance and select \"Administration\" on the left-hand menu\n- Under \"User and access\" select \"Service accounts\"\n- Find the service account that uses the identified service account token\n- Select the service account name in the \"Account\" column of the service accounts table\n- Under the \"Tokens\" section of the service account, select the \"X\" to reveal the \"Delete\" option\n- Select \"Delete\"\n\nFor more information, please see [Grafana's documentation on service accounts](https://grafana.com/docs/grafana-cloud/account-management/authentication-and-permissions/service-accounts/)."
tags = ['gitlab_blocking']
keywords = ['glsa_']

[[rules]]
id = 'Hashicorp Terraform user/org API token'
regex = "['\\\"][a-zA-Z0-9]{14}\\.atlasv1\\.[a-zA-Z0-9-_=]{60,70}['\\\"]"
description = "A HashiCorp Terraform API token was identified. API tokens can be used to access the HCP Terraform API. A malicious\nactor with access to this token can perform all actions the user account is entitled to."
title = 'HashiCorp Terraform API token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke an API token:\n\n- Sign in to the Terraform HCP console and access <https://app.terraform.io/app/settings/tokens>\n- Find the token that was identified\n- Select the trash icon on the right hand side of the token\n- When prompted, select \"Confirm\" in the \"Deleting token ...\" dialog\n\nFor more information, please see [Terraform's documentation on API tokens](https://app.terraform.io/app/settings/tokens)."
tags = ['gitlab_blocking']
keywords = ['.atlasv1.']

[[rules]]
id = 'Hashicorp Vault batch token'
regex = 'b\.AAAAAQ[0-9a-zA-Z_-]{156}'
description = "A HashiCorp Vault batch token was identified. Batch tokens are used when hundereds to thousands of systems need to\naccess Vault but generating unique tokens would not scale. These tokens are usually short lived and bound to a\nspecific vault policy. A malicious actor with access to this token can impersonate a service and would have the same\npermission levels as the policy that the batch token is created for."
title = 'HashiCorp Vault batch token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nBatch tokens cannot be revoked so you should use very short \"time to live\" values when creating batch tokens.\n\nFor more information, please see [Vault's documentation on batch tokens](https://developer.hashicorp.com/vault/tutorials/tokens/batch-tokens)."
tags = ['gitlab_blocking']
keywords = ['b.AAAAAQ']

[[rules]]
id = 'HashicorpVaultServiceToken'
regex = '\bhvs\.(?:[a-zA-Z0-9]{24}|CAES[a-zA-Z0-9_-]{80,130})\b'
description = "A HashiCorp Vault Service Token is an authentication credential used to access HashiCorp Vault, a secrets\nmanagement platform. This token grants access to secrets, encryption keys, and other sensitive data stored in\nVault based on the policies attached to it. A malicious actor with access to this token could read, modify, or\ndelete secrets, potentially compromising entire infrastructure environments and any systems that rely on Vault\nfor credential management."
title = 'HashiCorp Vault Service Token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab\ndocumentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo revoke your HashiCorp Vault Service Token:\n\n1. Log in to your Vault instance at `https://your-vault-address:8200/ui` or use the Vault CLI\n2. Navigate to the \"Access\" section and select \"Auth Methods\" to identify the authentication method used\n3. Use the Vault CLI command `vault token lookup <token>` to identify the compromised token and its accessor\n4. Revoke the token immediately using `vault token revoke <token>` or `vault token revoke -accessor <accessor>`\n5. Generate a new token with appropriate policies using `vault token create -policy=<policy-name>` and update\n   all applications and services that were using the compromised token\n6. Verify the revocation by attempting to use the old token, which should return an authentication error, and\n   audit Vault logs at `/sys/audit` to review any unauthorized access during the exposure period\n\nFor detailed information on managing HashiCorp Vault Service Tokens, please see the\n[Vault Tokens documentation](https://developer.hashicorp.com/vault/docs/concepts/tokens)."
tags = ['gitlab_blocking']
keywords = ['hvs.']

[[rules]]
id = 'Heroku API Key'
regex = '\bHRKU-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\b'
description = "A Heroku API key or application authorization token was identified. API keys and authorization tokens can be used to\nperform API calls on behalf of a user or account. A malicious actor with access to these tokens can access the Heroku\nAPI platform and all deployed applications."
title = 'Heroku API key or application authorization token'
remediation = "For general guidance on handling security incidents with regards to leaked keys, please see the GitLab documentation on\n[Credential exposure to the internet](https://docs.gitlab.com/ee/security/responding_to_security_incidents.html#credential-exposure-to-public-internet).\n\nTo regenerate an API key for the identified user:\n\n- Sign in to your account and visit <https://dashboard.heroku.com/account>\n- Under the \"API Key\" section, select \"Regenerate API Key\"\n- When prompted, select \"Regenerate API Key\" in the \"Regenerate API Key\" dialog\n\nTo regenerate an application authorization token:\n\n- Sign in to your account and visit <https://dashboard.heroku.com/account/applications>\n- Under the \"Authorizations\" section, find the registered authorization that contains the identified token\n- Select the pencil icon\n- Select \"Regenerate token\"\n\nFor more information on API keys, see [their FAQ on generating API keys](https://help.heroku.com/PBGP6IDE/how-should-i-generate-an-api-key-that-allows-me-to-use-the-heroku-platform-api).\n\nHeroku does not have any documentation on application authorization tokens."
tags = ['gitlab_blocking']
keywords = ['HRKU-']

[[rules]]
id = 'HighnoteTestSecretKey'
regex = '\bsk_test_[0-9A-Za-z_]{63,98}\b'
description = 'Highnote Test Secret Key'
