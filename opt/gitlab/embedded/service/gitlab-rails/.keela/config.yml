# Keela configuration for GitLab
# https://github.com/kerrizor/keela
#
# Note: When using custom directory_patterns, exclude_patterns cannot be used.
#
baseline_path: scripts/lint/keela_baseline.yml

# Exclusions file for false positives (methods called dynamically, via metaprogramming, etc.)
excluded_path: scripts/lint/keela_excluded.yml

directory_patterns:
  - "{ee/,}app/**/*.%<ext>s"
  - "{ee/,}config/**/*.%<ext>s"
  - "{ee/,}lib/**/*.%<ext>s"
  - "domains/*/{ee/,}{app,lib}/**/*.%<ext>s"

extensions:
  - rb
  - haml
  - erb
  - builder
  - rake

strategies:
  methods:
    definition_paths:
      - app/helpers
      - app/models
      - app/services

  # render_helpers teaches the partials strategy that these GitLab wrappers
  # render a partial from an explicit string path, so the partials they render
  # are not false-flagged as unused. keela recognizes only render/
  # render_to_string/render_to_body by default. Matched for explicit paths
  # only, never bareword-relative resolution.
  #
  partials:
    render_helpers:
      - render_if_exists
      - dispensable_render
      - dispensable_render_if_exists
      - view_to_html_string
      - tabs_json
