---
name: _read_agent_build
description: Private permission that gates reading the log and artifacts of jobs
  run by an agent flow (pipeline source duo_workflow). Ci::BuildPolicy and
  Authz::JobArtifactAccessPolicy combine this permission with the job's pipeline source
  to allow read_build_trace and read_job_artifacts. Must not be checked directly
  at enforcement points.
conditionally_enables: null
