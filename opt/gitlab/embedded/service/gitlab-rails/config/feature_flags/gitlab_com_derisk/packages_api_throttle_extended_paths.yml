name: packages_api_throttle_extended_paths
description: Counts the package list, detail, delete, pipelines and package_files API routes under the packages API rate limits instead of the general API rate limits. On GitLab.com, once the edge rate-limit bypass for Package Registry is removed, disabling this flag moves those routes to the stricter general API limits.
