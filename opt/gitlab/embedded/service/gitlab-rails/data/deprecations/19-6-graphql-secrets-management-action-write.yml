- title: "`WRITE` value of the GraphQL `SecretsManagementAction` enum"
  removal_milestone: "20.0"
  announcement_milestone: "19.6"
  breaking_change: true
  window:
  reporter: cdanzinger
  stage: Security Platform
  issue_url: https://gitlab.com/gitlab-org/gitlab/-/work_items/632994
  impact: low
  impact_offering: GitLab.com, self-managed
  scope: group, project
  resolution_role: Owner
  manual_task: true
  body: |  # (required) Don't change this line.
    GitLab deprecates the `WRITE` value of the `SecretsManagementAction` GraphQL enum in GitLab 19.6.
    GitLab removes `WRITE` in GitLab 20.0. This is a breaking change.

    `WRITE` grants both create and update. GitLab 19.6 adds an `UPDATE` value, so you can grant each one separately.
    The change affects the `actions` argument of `projectSecretsPermissionUpdate` and `groupSecretsPermissionUpdate`,
    and the `actions` field of the `ProjectSecretsPermission` and `GroupSecretsPermission` types.

    Until GitLab 20.0, the `actions` field still returns `WRITE` for a grant that has create and update.
    From GitLab 20.0, it returns `CREATE` and `UPDATE` in place of `WRITE`.

    To prepare, send `CREATE` and `UPDATE` in place of `WRITE`. Update code that reads `actions` to
    accept `CREATE` and `UPDATE`. Existing grants keep working. You do not need to change any data.
