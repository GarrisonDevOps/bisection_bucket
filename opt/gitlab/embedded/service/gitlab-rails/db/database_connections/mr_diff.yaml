name: mr_diff
description: GitLab database holding the merge request diff storage tables.
gitlab_schemas:
  - gitlab_internal
  - gitlab_shared
  - gitlab_shared_org
  - gitlab_shared_cell_local
  - gitlab_mr_diff
lock_gitlab_schemas:
  - gitlab_main
  - gitlab_main_cell_setting
  - gitlab_main_user
  - gitlab_main_org
  - gitlab_main_cell_local
  - gitlab_main_jh
  - gitlab_ci
  - gitlab_ci_cell_local
  - gitlab_pm
  - gitlab_sec
  - gitlab_sec_cell_local
klass: MrDiffApplicationRecord
# if the MR diff database is not configured, use this database
fallback_database: main
uses_load_balancing: true
