
---
description: Scan metrics for a GitLab Secrets Scanner analyzer scan launched from a pipeline job.
internal_events: true
status: active
action: collect_gss_source_code_analyzer_scan_metrics_from_pipeline
identifiers:
- project
- namespace
- user
additional_properties:
  time_s:
    description: Scan duration in seconds.
  exit_code:
    description: Gitleaks exit code.
  git_strategy:
    description: Fetch strategy used.
  commit_count:
    description: Number of commits scanned.
  bytes_scanned:
    description: Bytes scanned by Gitleaks.
  leaks_found:
    description: Number of secrets detected.
  repo_size_kb:
    description: Repository size in KB.
  pipeline_type:
    description: Type of pipeline that ran the scan.
  error_message:
    description: Error message if scan failed.
  generic_secrets_enabled:
    description: Whether Generic Secrets detection was enabled for the scan ("true" or "false").
  reported_generic_leaks_found:
    description: Number of generic secrets in the report, after allowlists, exclusions, and false-positive filtering.
  deepen_fetch_fallback:
    description: Why the deepen fetch steps left gaps in a commit range, so the scan fell back to less history ("deepen_timeout", "deepen_reached_limit" (gaps remain at the maximum deepen depth) or "deepen_failed"). Sent only when deepen steps ran and the scan fell back.
  deepen_fetch_time_s:
    description: Total time in seconds of the deepen fetch steps that fill gaps in a commit range. Sent only when deepen steps ran.
  deepen_fetch_timed_out:
    description: Whether the deepen fetch steps reached the time limit ("true" or "false"). Sent only when deepen steps ran.
product_group: secret_detection
product_categories:
- secret_detection
milestone: '19.2'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/240926
tiers:
- ultimate
