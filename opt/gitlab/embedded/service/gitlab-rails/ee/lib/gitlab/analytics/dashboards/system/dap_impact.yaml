- title: Spend
  duoPrompts:
  - Which model is costing us the most credits?
  - How are credits trending, excluding Chat?
  - Which capabilities drive spend on each model?
  - Why is Chat excluded from the credits chart?
  panels:
  # The top capabilities get their own stacked segment and legend entry; the rest roll
  # into an Other segment.
  - title: Credits by model, by capability
    tooltip:
      description: Credits consumed by each model in the selected date range, stacked by capability. Credits are processed after sessions are billed, so recent totals may be incomplete.
      template: dap_credits_tooltip
    visualization:
      type: Glql
      options:
        showActions: true
      data:
        type: glql
        query:
          dateField: created
          glql: |
            display: barList
            mode: analytics
            query: type = DuoWorkflow
            dimensions: model, flowType
            metrics: creditsUsedSum
            displayConfig:
              maxSeries: 5
    gridAttributes:
      yPos: 0
      xPos: 0
      width: 12
      height: 37
  - title: Credits
    tooltip:
      description: Total credits consumed by GitLab Duo Agent Platform (DAP) sessions in the selected date range. Credits are processed after sessions are billed, so recent totals may be incomplete.
      template: dap_credits_tooltip
    visualization:
      type: Glql
      options:
        showActions: true
        showTrends: true
      data:
        type: glql
        query:
          dateField: created
          glql: |
            display: stat
            mode: analytics
            query: type = DuoWorkflow
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
              description: Total credits consumed over the selected period
    gridAttributes:
      yPos: 37
      xPos: 0
      width: 6
      height: 14
  - title: Chat
    tooltip:
      description: Credits consumed by Chat sessions in the selected date range. Credits are processed after sessions are billed, so recent totals may be incomplete.
      template: dap_credits_tooltip
    visualization:
      type: Glql
      options:
        showActions: true
        showTrends: true
      data:
        type: glql
        query:
          dateField: created
          glql: |
            display: stat
            mode: analytics
            # chat and agentic chat are the two chat session flow types on this source
            query: type = DuoWorkflow and flowType in ("chat", "agentic_chat/v1")
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
              description: Credits consumed by Chat sessions
    gridAttributes:
      yPos: 37
      xPos: 6
      width: 6
      height: 14
  - title: Credits over time
    tooltip:
      description: Credits consumed over the selected period, stacked by capability. Credits are processed after sessions are billed, so recent totals may be incomplete.
      template: dap_credits_tooltip
    visualization:
      type: Glql
      options:
        showActions: true
      data:
        type: glql
        query:
          dateField: created
          glql: |
            display: columnChart
            mode: analytics
            query: type = DuoWorkflow
            dimensions: created(%{dynamicGranularity}), flowType
            metrics: creditsUsedSum
            # the second key keeps paging stable, since flow types in a bucket tie on `created`
            sort: created asc, creditsUsedSum desc
            displayConfig:
              maxSeries: 5
    gridAttributes:
      yPos: 51
      xPos: 0
      width: 12
      height: 53
