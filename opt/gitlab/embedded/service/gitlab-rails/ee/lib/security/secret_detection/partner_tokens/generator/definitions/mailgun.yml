---
token_type: "Mailgun private API token"
class_name: "MailgunClient"
partner_name: "mailgun"
endpoint: "https://api.mailgun.net/v4/domains"
http_method: "get"
auth_style: "basic_password"
auth_param: "api"
token_pattern: '\Akey-[a-f0-9]{32}\z'
sample_token: "key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
rate_limit_key: "partner_mailgun_api"
doc_url: "https://documentation.mailgun.com/docs/mailgun/api-reference/authentication/"
status_map:
  "200": "active"
  "401": "inactive"
  "429": "rate_limit"
  "500": "network_error"
  "502": "network_error"
  "503": "network_error"
  "504": "network_error"
