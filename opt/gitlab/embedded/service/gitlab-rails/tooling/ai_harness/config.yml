# Files within FORBIDDEN_PATTERNS that are intentionally committed as
# project content. Listed prefixes use start_with? matching, so both
# exact-file paths and directory prefixes work.
#
# To add a new entry, append it here with a comment describing why the
# exception is needed. Open a small, spec-driven MR to the doctor tool
# that:
#   1. Adds the entry to this file
#   2. Adds an integration spec exercising the new path
#   3. Updates SPECIFICATION/04_scenarios.md if a new scenario emerges
allowed_committed_files:
  # Project-scope skill committed by !232403. Auto-generated from
  # .ai/principles/manifest.yml; loaded by both OpenCode (.agents/skills/)
  # and Claude Code (.claude/skills/) to provide the routing table for
  # the gitlab-coding-principles content.
  - .claude/skills/gitlab-coding-principles/SKILL.md
  # Project-scope explainer for the shared Claude Code skills directory
  # (gitlab-org/gitlab#20880). Committed so every contributor sees the
  # same conventions; the directory itself is auto-discovered by Claude
  # Code with no install step.
  - .claude/skills/README.md
  # Project-scope glab skill (gitlab-org/gitlab#601836). The directory prefix
  # allows all of the skill's files.
  - .claude/skills/glab/
  # Project-scope split-mr skill. Analyzes all changes on the current branch
  # (uncommitted or already committed) and reasons about whether they should be
  # split into smaller, more focused MRs.
  - .claude/skills/split-mr/
  # Project-scope gitlab-mcp-tool-builder skill. Scaffolds a GraphQL-backed MCP
  # server tool following the app/services/mcp/tools/ pattern. Vendored from the
  # ai/skills repo; the directory prefix allows all of the skill's files.
  - .claude/skills/gitlab-mcp-tool-builder/
  # Project-scope ai-principles-review-feedback skill. Mechanics for acting on
  # automated review feedback on the weekly principles distillation sync merge
  # requests. The policy it implements lives in
  # doc/development/ai_instruction_files_review.md.
  - .claude/skills/ai-principles-review-feedback/
  # Project-scope postgresai skill. Runs EXPLAIN and index experiments on
  # PostgresAI Database Lab clones. Source of truth is this repo; the
  # gitlab-org/ai/skills project syncs it from here.
  - .claude/skills/postgresai/
  # Project-scope gitlab-query-plans skill. Produces raw SQL and Database Lab
  # query plans for database review; the directory prefix allows all of the
  # skill's files.
  - .claude/skills/gitlab-query-plans/
  # Project-scope gitlab-backport skill. Guides backporting bug fixes to
  # maintained stable branches. Source of truth is this repo.
  - .claude/skills/gitlab-backport/
  # Project-scope fe-test-janitor skill. Documents the CLI at
  # tooling/bin/fe_test_janitor, which classifies RSpec feature spec examples as
  # migrate/reframe/partial/keep candidates for MSW migration. The directory prefix
  # allows all of the skill's files.
  - .claude/skills/fe-test-janitor/
  # Project-scope fixture-coverage skill. Turns gitlab:seed:value_class_report
  # output into a development fixture for a table that has no seed data. The
  # directory prefix allows all of the skill's files.
  - .claude/skills/fixture-coverage/
  # Project-scope feature-flag skill. Documents creating feature flag
  # definitions with bin/feature-flag --non-interactive. The directory prefix
  # allows all of the skill's files.
  - .claude/skills/feature-flag/
